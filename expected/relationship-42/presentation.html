<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Relationship 42 presentation</title>
    <style>
:root {
  color-scheme: light;
  font-family: system-ui, sans-serif;
  color: #172033;
  background: #eef2f7;
}

* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  display: grid;
  place-items: center;
  padding: 1rem;
}

main {
  width: min(100%, 80rem);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #ffffff;
  border: 1px solid #cad3e1;
  border-radius: 1rem;
  box-shadow: 0 1rem 3rem rgb(23 32 51 / 18%);
}

section {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 1.25rem;
  padding: clamp(1.5rem, 5vw, 4.5rem);
}

section[hidden] {
  display: none;
}

h1,
h2 {
  margin: 0;
  color: #103f72;
  font-size: clamp(2rem, 5vw, 4.5rem);
  line-height: 1.08;
}

p,
li {
  font-size: clamp(1.1rem, 2.2vw, 2rem);
  line-height: 1.5;
}

p,
ul {
  margin-block: 0;
}

ul {
  align-self: center;
  padding-inline-start: 1.5em;
}

button {
  justify-self: end;
  min-width: 8rem;
  padding: 0.75rem 1.25rem;
  border: 2px solid #1769aa;
  border-radius: 0.5rem;
  color: #ffffff;
  background: #1769aa;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

button:hover {
  background: #0d4f86;
}

button:focus-visible,
h1:focus-visible,
h2:focus-visible {
  outline: 0.3rem solid #f6a800;
  outline-offset: 0.25rem;
}
    </style>
  </head>
  <body>
    <main aria-label="Relationship 42 presentation">
      <section id="slide-1" aria-labelledby="slide-1-title">
        <h1 id="slide-1-title" tabindex="-1">Relationship 42</h1>
        <p>Alice is associated with Bob.</p>
        <button type="button" data-intent="advance">Next</button>
      </section>
      <section id="slide-2" aria-labelledby="slide-2-title" hidden>
        <h2 id="slide-2-title" tabindex="-1">Participants</h2>
        <ul>
          <li>Alice</li>
          <li>Bob</li>
        </ul>
        <button type="button" data-intent="back">Previous</button>
      </section>
    </main>
    <script>
(() => {
  "use strict";

  const main = document.querySelector("main");
  if (main === null) {
    return;
  }

  const slides = Array.from(main.children).filter(
    (element) => element.tagName === "SECTION",
  );
  if (slides.length === 0) {
    return;
  }

  let slideIndex = slides.findIndex((slide) => !slide.hasAttribute("hidden"));
  if (slideIndex === -1) {
    slideIndex = 0;
    slides[0].removeAttribute("hidden");
  }

  main.addEventListener("click", (event) => {
    const control = event.target.closest("button[data-intent]");
    if (control === null || !main.contains(control)) {
      return;
    }

    const intent = control.getAttribute("data-intent");
    let nextIndex = slideIndex;
    if (intent === "advance") {
      nextIndex = Math.min(slideIndex + 1, slides.length - 1);
    } else if (intent === "back") {
      nextIndex = Math.max(slideIndex - 1, 0);
    } else {
      return;
    }

    if (nextIndex === slideIndex) {
      return;
    }

    for (let index = 0; index < slides.length; index += 1) {
      slides[index].toggleAttribute("hidden", index !== nextIndex);
    }
    slideIndex = nextIndex;

    const heading = slides[slideIndex].querySelector("h1, h2");
    if (heading !== null) {
      heading.focus();
    }
  });
})();
    </script>
  </body>
</html>
