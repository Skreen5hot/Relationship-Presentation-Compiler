name: Phase 0 through 10 gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-phase10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-platforms:
    name: Node 24.19 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up exact Node baseline
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm

      - name: Set up exact npm baseline
        run: npm install --global npm@11.17.0

      - name: Install locked graph
        run: npm ci

      - name: Verify runtime lock baseline
        run: npm run check:runtime

      - name: Run Phase 0 Node, schema, CPS, and native-lock gates
        run: npm run test:phase0:node

      - name: Verify locked artifacts, ontology evidence, carriers, and SBOM
        run: npm run test:phase1

      - name: Verify the core boundary, structural scanner, and Node CPS harness
        run: npm run test:phase2:node

      - name: Verify Node publication safety, locking, and crash recovery
        run: npm run test:phase3:node

      - name: Reproduce and verify the locked browser core bundle
        run: npm run test:phase4:node

      - name: Verify request, resolution, closed-world contract, and Stages 01–03
        run: npm run test:phase5:node

      - name: Verify selection, provenance, narrative, and Stages 04–06
        run: npm run test:phase6:node

      - name: Verify HTML projection, renderer, revalidator, and demo
        run: npm run test:phase7:node

      - name: Verify fingerprints, manifests, fourteen-file set, and byte-map mutations
        run: npm run test:phase8:node

      - name: Verify failure ordering, reports, exit classes, and status lines
        run: npm run test:phase9:node

      - name: Run the full Node host and release conformance corpus
        run: npm run test:phase10:node

  chromium-worker:
    name: Chromium Worker equivalence
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up exact Node baseline
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm

      - name: Set up exact npm baseline
        run: npm install --global npm@11.17.0

      - name: Install locked graph
        run: npm ci

      - name: Install pinned Chromium shell and system dependencies
        run: node node_modules/playwright/cli.js install --with-deps --only-shell chromium

      - name: Verify runtime lock baseline
        run: npm run check:runtime

      - name: Run real-browser Worker gate
        run: npm run test:phase0:browser

      - name: Run poisoned Chromium core-equivalence gate
        run: npm run test:phase2:browser

      - name: Run the supervised reference Browser host
        run: npm run test:phase4:browser

      - name: Run Phase 5 semantic equivalence through the Chromium Worker host
        run: npm run test:phase5:browser

      - name: Run Phase 6 narrative and presentation equivalence through the Worker host
        run: npm run test:phase6:browser

      - name: Verify Phase 7 HTML semantics and navigation in Chromium
        run: npm run test:phase7:browser

      - name: Verify the complete success result through the Chromium Worker host
        run: npm run test:phase8:browser

      - name: Verify failure surfaces through the Chromium Worker host
        run: npm run test:phase9:browser

      - name: Run the full equivalence and poisoned corpus in Chromium
        run: npm run test:phase10:browser
